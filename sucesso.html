<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pagamento confirmado — FTZ Bot</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #262b36;
    --text: #e6e8ec; --muted: #9aa2b1; --accent: #5865f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1a1e2a 0%, var(--bg) 55%);
    color: var(--text);
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 40px; max-width: 420px; text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: var(--muted); line-height: 1.6; }
  .btn {
    display: inline-flex; margin-top: 20px; padding: 14px 28px; border-radius: 10px;
    background: var(--accent); color: white; text-decoration: none; font-weight: 600;
  }
  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; margin: 20px auto; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6fa; --card: #ffffff; --border: #e3e6ee; --text: #14161b; --muted: #5a6070; }
  }
</style>
</head>
<body>
  <div class="card" id="content">
    <div class="spinner"></div>
    <h1>Confirmando seu pagamento…</h1>
    <p>Isso pode levar alguns segundos.</p>
  </div>

  <script>
    const FUNCTIONS_URL = "https://xfzfttpnkxqevjfwijpw.supabase.co/functions/v1";
    const INVITE_URL = "https://discord.com/oauth2/authorize?client_id=1533841269648916550&permissions=2147568656&integration_type=0&scope=bot%20applications.commands";

    const params = new URLSearchParams(window.location.search);
    const ref = params.get("external_reference");
    const content = document.getElementById("content");

    function showActive() {
      content.innerHTML = `
        <h1>✅ Pagamento confirmado!</h1>
        <p>Agora é só adicionar o bot no seu servidor.</p>
        <a class="btn" href="${INVITE_URL}">➕ Adicionar ao Discord</a>
      `;
    }

    function showPending(attempt) {
      content.innerHTML = `
        <div class="spinner"></div>
        <h1>Aguardando confirmação…</h1>
        <p>O Mercado Pago às vezes demora um pouco pra avisar a gente. Tentativa ${attempt}/10.</p>
      `;
    }

    function showError(msg) {
      content.innerHTML = `<h1>⚠️ ${msg}</h1><p>Se você pagou e isso não atualizar, entra em contato.</p>`;
    }

    async function checkStatus(attempt = 1) {
      if (!ref) {
        showError("Referência de pagamento não encontrada na URL.");
        return;
      }
      try {
        const res = await fetch(`${FUNCTIONS_URL}/check-status?ref=${encodeURIComponent(ref)}`);
        const data = await res.json();

        if (data.status === "active") {
          showActive();
          return;
        }

        if (attempt >= 10) {
          showError("Ainda não confirmado — tente atualizar a página em 1 minuto.");
          return;
        }

        showPending(attempt);
        setTimeout(() => checkStatus(attempt + 1), 3000);
      } catch (err) {
        showError("Erro ao checar status: " + err.message);
      }
    }

    checkStatus();
  </script>
</body>
</html>
