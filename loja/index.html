<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja — Servidor DayZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14140f;
    --panel: #1c1c17;
    --panel-2: #24241c;
    --line: #35352a;
    --line-strong: #4a4a3a;
    --accent: #e3a63e;
    --accent-dim: #a97a2a;
    --danger: #d1583a;
    --text: #ece9df;
    --text-dim: #aba99a;
    --text-faint: #726f61;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
  }
  button{
    font-family: inherit;
    color: inherit;
  }
  .mono{ font-family: 'JetBrains Mono', monospace; }

  header{
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header .brand{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .brand .mark{
    width: 34px; height: 34px;
    border: 1px solid var(--accent-dim);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  header h1{
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  header .sub{
    margin: 0;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  header .stats{
    display: flex;
    gap: 18px;
    text-align: right;
  }
  header .stats .label{
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 2px;
  }
  header .stats .value{
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  header .stats .value.accent{ color: var(--accent); }

  main{
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 140px;
  }

  nav.cats{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  nav.cats button{
    display: flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }
  nav.cats button.active{
    border-color: var(--accent-dim);
    background: var(--panel-2);
    color: var(--accent);
  }

  .empty{
    color: var(--text-faint);
    font-size: 13px;
    padding: 20px 4px;
  }

  .items{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }

  .item{
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    text-align: left;
    position: relative;
  }
  .item.selected{
    border-color: var(--accent);
    background: var(--panel-2);
  }
  .item .thumb{
    width: 100%;
    max-width: 500px;
    aspect-ratio: 1 / 1;
    border-radius: 4px;
    background: var(--bg);
    border: 1px dashed var(--line-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .item.selected .thumb{
    border-color: var(--accent-dim);
  }
  .item .thumb img{
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .item .thumb .fallback{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
    line-height: 1.3;
  }
  .item .info{
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .item .info .name{
    font-size: 14px;
    font-weight: 600;
    line-height: 1.25;
  }
  .item .info .price{
    font-size: 12px;
    color: var(--text-dim);
  }
  .item .check{
    position: absolute;
    top: 18px;
    right: 18px;
    width: 22px; height: 22px;
    border-radius: 3px;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: var(--bg);
    font-size: 13px;
    font-weight: 700;
  }
  .item.selected .check{
    background: var(--accent);
    border-color: var(--accent);
  }

  .drawer{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .drawer-inner{
    max-width: 720px;
    margin: 0 auto;
  }
  .drawer .status{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .drawer .drop-row{
    display: none;
    gap: 8px;
    margin-bottom: 10px;
  }
  .drawer .drop-row.show{ display: flex; }
  .drawer .drop-row input{
    flex: 1;
    height: 38px;
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    color: var(--text);
    padding: 0 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .drawer .drop-row input::placeholder{ color: var(--text-faint); }
  .drawer .actions{
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .drawer button.ghost{
    height: 38px;
    padding: 0 16px;
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .drawer button.primary{
    height: 38px;
    padding: 0 18px;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #14180d;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .drawer button:disabled{
    opacity: 0.5;
    cursor: default;
  }

  @media (max-width: 480px){
    header .stats{ gap: 12px; }
    .items{ grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">DZ</div>
    <div>
      <h1>Loja do servidor</h1>
      <p class="sub" id="playerLabel">carregando jogador…</p>
    </div>
  </div>
  <div class="stats">
    <div>
      <p class="label">Saldo</p>
      <p class="value mono" id="saldoValue">—</p>
    </div>
    <div>
      <p class="label">Carrinho</p>
      <p class="value mono accent" id="cartValue">0</p>
    </div>
  </div>
</header>

<main>
  <nav class="cats" id="cats"></nav>
  <div class="items" id="items"></div>
</main>

<div class="drawer">
  <div class="drawer-inner">
    <p class="status mono" id="statusLine">Carregando catálogo…</p>
    <div class="drop-row" id="dropRow">
      <input id="dropInput" type="text" placeholder="Local de drop (ex: 007 114)" autocomplete="off">
    </div>
    <div class="actions">
      <button class="ghost" id="clearBtn">Limpar carrinho</button>
      <button class="primary" id="buyBtn" disabled>Comprar</button>
    </div>
  </div>
</div>

<script>
(function(){

  const FUNCTIONS_URL = "https://xfzfttpnkxqevjfwijpw.supabase.co/functions/v1";

  var params = new URLSearchParams(window.location.search);
  var playerToken = params.get('token') || null;

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }

  // Categorias reais do catalogo (mesmas de LOJA_CATEGORIES em
  // src/index.js) — a ordem aqui define a ordem dos botoes de nav.
  var CATS = [
    { id: 'weapons', label: 'Armas' },
    { id: 'containers', label: 'Equipamentos' },
    { id: 'clothes', label: 'Roupas' },
    { id: 'rosto', label: 'Rosto' },
    { id: 'tools', label: 'Ferramentas' },
    { id: 'food', label: 'Comida' },
    { id: 'explosives', label: 'Explosivos' },
    { id: 'veiculos', label: 'Veículos' },
    { id: 'pecas', label: 'Peças de Veículo' },
    { id: 'lootdispatch', label: 'Diversos' },
    { id: 'outros', label: 'Outros' }
  ];

  // Preenchido em carregarJogador() com o catalogo real vindo do backend,
  // agrupado por categoria: { categoria: [{name, price}, ...] }
  var ITEMS = {};

  var catsEl = document.getElementById('cats');
  var itemsEl = document.getElementById('items');
  var statusLine = document.getElementById('statusLine');
  var buyBtn = document.getElementById('buyBtn');
  var clearBtn = document.getElementById('clearBtn');
  var saldoValue = document.getElementById('saldoValue');
  var cartValue = document.getElementById('cartValue');
  var dropRow = document.getElementById('dropRow');
  var dropInput = document.getElementById('dropInput');
  var playerLabel = document.getElementById('playerLabel');

  var saldo = 0;
  var activeCat = null;
  var cart = {};
  var carregado = false;

  function fmt(v){
    return v.toLocaleString('pt-BR') + ' DZCoins';
  }

  function cartKey(catId, name){ return catId + '::' + name; }
  function cartTotal(){
    var t = 0;
    Object.keys(cart).forEach(function(k){ t += cart[k].price; });
    return t;
  }
  function cartCount(){ return Object.keys(cart).length; }

  function renderStats(){
    saldoValue.textContent = fmt(saldo);
    cartValue.textContent = fmt(cartTotal());
  }

  function catsComItens(){
    return CATS.filter(function(cat){ return (ITEMS[cat.id] || []).length > 0; });
  }

  function renderCats(){
    catsEl.innerHTML = '';
    catsComItens().forEach(function(cat){
      var btn = document.createElement('button');
      btn.textContent = cat.label;
      if (cat.id === activeCat) btn.classList.add('active');
      btn.addEventListener('click', function(){
        activeCat = cat.id;
        renderCats();
        renderItems();
      });
      catsEl.appendChild(btn);
    });
  }

  function renderItems(){
    itemsEl.innerHTML = '';

    if (!carregado){
      itemsEl.innerHTML = '<p class="empty">Carregando catálogo…</p>';
      return;
    }
    if (!activeCat){
      itemsEl.innerHTML = '<p class="empty">Nenhum item disponível no momento.</p>';
      return;
    }

    (ITEMS[activeCat] || []).forEach(function(item){
      var key = cartKey(activeCat, item.name);
      var inCart = !!cart[key];

      var card = document.createElement('button');
      card.className = 'item' + (inCart ? ' selected' : '');

      var thumb = item.image
        ? '<img src="' + escapeAttr(item.image) + '" alt="">'
        : '<span class="fallback">sem<br>imagem</span>';

      card.innerHTML =
        '<span class="thumb">' + thumb + '</span>' +
        '<span class="info">' +
          '<span class="name">' + escapeHtml(item.name) + '</span>' +
          '<span class="price mono">' + fmt(item.price) + '</span>' +
        '</span>' +
        '<span class="check">' + (inCart ? '✓' : '') + '</span>';

      card.addEventListener('click', function(){
        if (inCart){
          delete cart[key];
        } else {
          cart[key] = { name: item.name, price: item.price };
        }
        renderItems();
        renderStats();
        renderStatus();
        dropRow.classList.toggle('show', cartCount() > 0);
      });

      itemsEl.appendChild(card);
    });
  }

  function renderStatus(){
    var count = cartCount();
    statusLine.textContent = count === 0
      ? 'Carrinho vazio.'
      : count + ' item(ns) no carrinho — total ' + fmt(cartTotal()) + '.';
  }

  clearBtn.addEventListener('click', function(){
    cart = {};
    dropInput.value = '';
    dropRow.classList.remove('show');
    renderItems();
    renderStats();
    renderStatus();
  });

  buyBtn.addEventListener('click', function(){
    var count = cartCount();
    if (count === 0){
      statusLine.textContent = 'Selecione ao menos um item.';
      return;
    }
    var local = dropInput.value.trim();
    if (!local){
      statusLine.textContent = 'Informe o local de drop antes de confirmar.';
      return;
    }
    var total = cartTotal();
    if (total > saldo){
      statusLine.textContent = 'Saldo insuficiente para o carrinho atual.';
      return;
    }

    buyBtn.disabled = true;
    statusLine.textContent = 'Processando compra de ' + count + ' item(ns)...';

    enviarCompra({
      token: playerToken,
      itens: Object.keys(cart).map(function(k){ return cart[k]; }),
      total: total,
      local: local
    }).then(function(resultado){
      saldo = resultado.saldo;
      cart = {};
      dropInput.value = '';
      dropRow.classList.remove('show');
      renderItems();
      renderStats();
      buyBtn.disabled = false;
      statusLine.textContent = 'Compra concluída. Drop em ' + local + ' após a próxima liberação. Saldo: ' + fmt(saldo) + '.';
    }).catch(function(err){
      buyBtn.disabled = false;
      statusLine.textContent = err && err.message ? err.message : 'Não foi possível concluir a compra. Tente novamente.';
    });
  });

  // ---------------------------------------------------------------------
  // Pontes com o backend (Supabase Edge Functions).
  // ---------------------------------------------------------------------

  function carregarJogador(){
    if (!playerToken){
      return Promise.reject(new Error('Link inválido — gera um novo no Discord.'));
    }
    return fetch(FUNCTIONS_URL + '/loja-catalogo?token=' + encodeURIComponent(playerToken))
      .then(function(res){ return res.json().then(function(body){ return { res: res, body: body }; }); })
      .then(function(r){
        if (!r.res.ok) throw new Error(r.body.error || 'Link expirado ou inválido.');
        return r.body;
      });
  }

  function enviarCompra(payload){
    return fetch(FUNCTIONS_URL + '/loja-comprar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function(res){ return res.json().then(function(body){ return { res: res, body: body }; }); })
      .then(function(r){
        if (!r.res.ok || !r.body.ok) throw new Error(r.body.error || 'Não foi possível concluir a compra.');
        return { saldo: r.body.wallet };
      });
  }

  // ---------------------------------------------------------------------
  // Inicialização
  // ---------------------------------------------------------------------
  renderCats();
  renderItems();
  renderStatus();

  carregarJogador().then(function(jogador){
    playerLabel.textContent = jogador.gamertag;
    saldo = jogador.wallet;

    ITEMS = {};
    (jogador.kits || []).forEach(function(kit){
      var cat = kit.category || 'outros';
      if (!ITEMS[cat]) ITEMS[cat] = [];
      ITEMS[cat].push({ name: kit.name, price: kit.price, image: kit.image_url || '' });
    });

    carregado = true;
    var disponiveis = catsComItens();
    activeCat = disponiveis.length ? disponiveis[0].id : null;

    buyBtn.disabled = false;
    renderStats();
    renderCats();
    renderItems();
    renderStatus();
  }).catch(function(err){
    playerLabel.textContent = 'erro ao carregar';
    statusLine.textContent = err.message || 'Não foi possível carregar a loja.';
    carregado = true;
    renderItems();
  });
})();
</script>

</body>
</html>
