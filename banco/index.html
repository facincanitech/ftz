<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caixa Eletrônico — FTZ Bot</title>
<meta name="description" content="Banco do jogador — sacar, depositar e transferir DZCoins." />
<style>
  :root {
    --bg: #0f1115;
    --surface-1: #10131a;
    --surface-2: #171a21;
    --border: #262b36;
    --border-strong: #333a4a;
    --text-primary: #e6e8ec;
    --text-secondary: #b6bcc8;
    --text-muted: #8890a0;
    --accent: #5865f2;
    --success: #2ecc71;
    --danger: #ff6b6b;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1a1e2a 0%, var(--bg) 55%);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .atm {
    width: 100%;
    max-width: 480px;
    background: var(--surface-2);
    border-radius: 8px;
    border: 0.5px solid var(--border);
  }

  .atm-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 0.5px solid var(--border);
  }
  .atm-header .who { display: flex; align-items: center; gap: 10px; }
  .atm-header .icon {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(46, 204, 113, 0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .atm-header .title { margin: 0; font-size: 15px; font-weight: 500; color: var(--text-primary); }
  .atm-header .subtitle { margin: 0; font-size: 12px; color: var(--text-muted); }

  .device-wrap { padding: 20px; }
  .device {
    background: var(--surface-1);
    border: 0.5px solid var(--border-strong);
    border-radius: 6px;
    padding: 14px;
  }
  .handle {
    height: 6px; width: 64px; background: var(--text-muted);
    border-radius: 1px; margin: 0 auto 14px; opacity: 0.5;
  }

  .console { display: flex; align-items: stretch; gap: 6px; margin-bottom: 14px; }
  .fkeys { display: flex; flex-direction: column; justify-content: space-between; }
  .fkey {
    width: 26px; height: 26px; border-radius: 4px;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2); color: var(--text-secondary);
    font-size: 10px; cursor: pointer;
  }
  .fkey:hover { border-color: var(--accent); color: #b3baff; }
  .fkey.active { border-color: var(--success); color: var(--success); }

  .screen {
    flex: 1;
    background: #0c1a06;
    border-radius: 4px;
    padding: 10px 12px;
    font-family: var(--font-mono);
    min-height: 108px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #97c459;
  }
  .screen .menu-row { display: flex; justify-content: space-between; font-size: 9px; color: #97c459; }
  .screen .msg { margin: 6px 0; font-size: 11px; line-height: 1.5; color: #97c459; text-align: center; white-space: pre-wrap; }
  .screen .amt { margin: 0; font-size: 17px; font-weight: 500; color: #c0dd97; text-align: right; min-height: 20px; }
  .screen input {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid #3a5a1f;
    color: #c0dd97; font-family: var(--font-mono); font-size: 12px; padding: 4px 0; outline: none;
  }
  .screen input::placeholder { color: #4e7a34; }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .keypad button {
    height: 34px; border-radius: 4px; border: 0.5px solid var(--border-strong);
    background: var(--surface-2); color: var(--text-primary); font-size: 14px; cursor: pointer;
  }
  .keypad button:hover { border-color: var(--accent); }
  .keypad .clear { color: var(--danger); }
  .keypad .ok { color: var(--success); }

  .dispenser { height: 10px; background: var(--text-muted); opacity: 0.5; border-radius: 2px; margin-top: 14px; transition: background 0.2s; }
  .dispenser.done { background: var(--success); opacity: 1; }
  .dispenser-label { text-align: center; font-size: 11px; color: var(--text-muted); margin: 6px 0 0; }

  .footer-bar {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 14px 20px; border-top: 0.5px solid var(--border);
  }
  .btn {
    height: 32px; padding: 0 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .btn-ghost { border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-secondary); }
  .btn-accent { border: none; background: var(--accent); color: white; font-weight: 500; }
  .btn-accent:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-screen { text-align: center; padding: 40px 24px; color: var(--text-muted); }
  .error-screen .icon { font-size: 32px; margin-bottom: 12px; }

  .pix-receipt { padding: 20px; text-align: center; }
  .pix-receipt .qr-box {
    background: #fff; border-radius: 8px; padding: 12px; display: inline-block; margin: 0 auto 14px;
  }
  .pix-receipt .qr-box img { display: block; width: 200px; height: 200px; }
  .pix-receipt p.status { font-size: 13px; color: var(--text-secondary); margin: 0 0 12px; min-height: 18px; }
  .pix-receipt .copia-cola {
    display: block; width: 100%; background: var(--surface-1); border: 0.5px solid var(--border-strong);
    border-radius: 6px; padding: 10px; font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary);
    word-break: break-all; max-height: 70px; overflow-y: auto; margin-bottom: 12px; text-align: left;
  }
  .pix-receipt .amount-line { font-size: 15px; color: var(--text-primary); margin: 0 0 14px; }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6fa; --surface-1: #eef0f5; --surface-2: #ffffff;
      --border: #e3e6ee; --border-strong: #d3d8e2;
      --text-primary: #14161b; --text-secondary: #3d4250; --text-muted: #5a6070;
    }
    body { background: radial-gradient(circle at 50% 0%, #eef0ff 0%, var(--bg) 55%); }
  }
</style>
</head>
<body>
  <div class="atm">
    <div class="atm-header">
      <div class="who">
        <span class="icon">🏦</span>
        <div>
          <p class="title">Caixa eletrônico</p>
          <p class="subtitle" id="subtitle">Carregando...</p>
        </div>
      </div>
    </div>

    <div class="device-wrap" id="deviceWrap"></div>
  </div>

  <script>
    const FUNCTIONS_URL = "https://xfzfttpnkxqevjfwijpw.supabase.co/functions/v1";
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const wrap = document.getElementById("deviceWrap");
    const subtitleEl = document.getElementById("subtitle");

    // state: 'menu' | 'sacar' | 'depositar' | 'transferir_gamertag' | 'transferir_valor' | 'comprar_valor' | 'comprar_qr'
    let state = "menu";
    let buffer = 0;
    let destinoGamertag = "";
    let session = { gamertag: "", wallet: 0, bank: 0 };
    let msg = "Bem-vindo(a).\nSelecione uma opção.";
    let busy = false;
    let pixPollTimer = null;
    let pixPollDeadline = 0;

    function fmt(v) {
      return v.toLocaleString("pt-BR") + " moedas";
    }
    function fmtReais(v) {
      return "R$ " + v.toLocaleString("pt-BR");
    }

    function menuLabels() {
      return {
        top: ["‹F1 Sacar", "Transferir F3›"],
        bottom: ["‹F2 Depositar", "Comprar F4›"],
      };
    }

    function renderDevice() {
      const labels = menuLabels();
      const showMenu = state === "menu";
      const showGamertagInput = state === "transferir_gamertag";
      const amtText =
        state === "transferir_gamertag"
          ? ""
          : state === "comprar_valor"
          ? fmtReais(buffer)
          : state !== "menu"
          ? fmt(buffer)
          : "";

      wrap.innerHTML = `
        <div class="device">
          <div class="handle"></div>
          <div class="console">
            <div class="fkeys">
              <button class="fkey ${state === "sacar" ? "active" : ""}" data-f="1" aria-label="F1">F1</button>
              <button class="fkey ${state === "depositar" ? "active" : ""}" data-f="2" aria-label="F2">F2</button>
            </div>
            <div class="screen">
              ${showMenu ? `<div class="menu-row"><span>${labels.top[0]}</span><span>${labels.top[1]}</span></div>` : "<div></div>"}
              <p class="msg">${msg}</p>
              ${
                showGamertagInput
                  ? `<input id="gamertagInput" type="text" placeholder="gamertag de quem recebe" autocomplete="off" />`
                  : `<p class="amt">${amtText}</p>`
              }
              ${showMenu ? `<div class="menu-row"><span>${labels.bottom[0]}</span><span>${labels.bottom[1]}</span></div>` : "<div></div>"}
            </div>
            <div class="fkeys">
              <button class="fkey ${state === "transferir_gamertag" || state === "transferir_valor" ? "active" : ""}" data-f="3" aria-label="F3">F3</button>
              <button class="fkey ${state === "comprar_valor" ? "active" : ""}" data-f="4" aria-label="F4">F4</button>
            </div>
          </div>

          <div class="keypad">
            ${[1,2,3,4,5,6,7,8,9].map((n) => `<button class="numkey" data-key="${n}">${n}</button>`).join("")}
            <button class="clear" id="clearKey" aria-label="Limpar ou voltar">⌫</button>
            <button class="numkey" data-key="0">0</button>
            <button class="ok" id="okKey" aria-label="Confirmar">✓</button>
          </div>

          <div class="dispenser ${busy === "done" ? "done" : ""}" id="dispenser"></div>
          <p class="dispenser-label" id="dispenserLabel">Bandeja de moedas</p>
        </div>
      `;

      wrap.querySelectorAll(".fkey").forEach((btn) => {
        btn.addEventListener("click", () => handleF(btn.dataset.f));
      });
      wrap.querySelectorAll(".numkey").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (state === "menu") return;
          const d = parseInt(btn.dataset.key, 10);
          const next = buffer * 10 + d;
          if (next <= 999999) buffer = next;
          renderDevice();
        });
      });
      const clearKey = document.getElementById("clearKey");
      if (clearKey) clearKey.addEventListener("click", onClear);
      const okKey = document.getElementById("okKey");
      if (okKey) okKey.addEventListener("click", onConfirm);
      const gamertagInput = document.getElementById("gamertagInput");
      if (gamertagInput) {
        gamertagInput.value = destinoGamertag;
        gamertagInput.focus();
        gamertagInput.addEventListener("input", (e) => (destinoGamertag = e.target.value));
      }
    }

    function goMenu() {
      clearTimeout(pixPollTimer);
      state = "menu";
      buffer = 0;
      destinoGamertag = "";
      msg = "Bem-vindo(a).\nSelecione uma opção.";
      renderDevice();
    }

    function handleF(f) {
      // Deixa trocar de operacao direto (F1->F2 etc) sem precisar cancelar
      // antes — isso so fazia sentido em ATM fisico de verdade, na web e
      // so friccao. So trava se tiver uma operacao rodando de verdade.
      if (busy) return;
      if (f === "1") { state = "sacar"; buffer = 0; msg = "Digite o valor a sacar\ne confirme (✓)."; }
      else if (f === "2") { state = "depositar"; buffer = 0; msg = "Digite o valor a depositar\ne confirme (✓)."; }
      else if (f === "3") { state = "transferir_gamertag"; destinoGamertag = ""; msg = "Digite o gamertag\nde quem recebe."; }
      else if (f === "4") { state = "comprar_valor"; buffer = 0; msg = "Digite o valor em R$\n(inteiro) e confirme (✓)."; }
      renderDevice();
    }

    function onClear() {
      if (state === "menu") return;
      if (state === "transferir_gamertag") {
        goMenu();
        return;
      }
      if (buffer > 0) {
        buffer = 0;
        renderDevice();
      } else {
        goMenu();
      }
    }

    async function onConfirm() {
      if (state === "menu" || busy) return;

      if (state === "transferir_gamertag") {
        if (!destinoGamertag.trim()) {
          msg = "Informe um gamertag\nválido.";
          renderDevice();
          return;
        }
        state = "transferir_valor";
        buffer = 0;
        msg = `Pra: ${destinoGamertag.trim()}\nDigite o valor.`;
        renderDevice();
        return;
      }

      if (buffer <= 0) {
        msg = "Informe um valor\nantes de confirmar.";
        renderDevice();
        return;
      }

      if (state === "comprar_valor") {
        await iniciarComprarPix();
        return;
      }

      const action = state === "transferir_valor" ? "transferir" : state;
      busy = true;
      msg = "Processando...";
      renderDevice();

      try {
        const res = await fetch(`${FUNCTIONS_URL}/banco-action`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, action, valor: buffer, destinoGamertag: destinoGamertag.trim() || undefined }),
        });
        const data = await res.json();
        busy = false;

        if (!res.ok || !data.ok) {
          msg = data.error || data.message || "Não foi possível concluir.";
          renderDevice();
          return;
        }

        session.wallet = data.wallet;
        session.bank = data.bank;
        msg = data.message + `\n\nCarteira: ${data.wallet} · Banco: ${data.bank}`;
        busy = "done";
        renderDevice();
        setTimeout(goMenu, 3000);
      } catch (err) {
        busy = false;
        msg = "Erro de conexão — tenta de novo.";
        renderDevice();
      }
    }

    // Compra de DZCoins via Pix (F4) — diferente de sacar/depositar/
    // transferir, precisa de uma tela própria (QR code não cabe na
    // telinha verde do "terminal"), então substitui o device inteiro
    // por um "recibo" com QR + copia-e-cola, e fica perguntando
    // (poll) se já pagou — mesmo padrão sem webhook usado no Discord.
    async function iniciarComprarPix() {
      busy = true;
      msg = "Gerando Pix...";
      renderDevice();

      try {
        const res = await fetch(`${FUNCTIONS_URL}/banco-comprar-pix-iniciar`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, valorReais: buffer }),
        });
        const data = await res.json();
        busy = false;

        if (!res.ok || data.error) {
          msg = data.error || "Não foi possível gerar o Pix.";
          renderDevice();
          return;
        }

        state = "comprar_qr";
        renderPixReceipt(data, "Aguardando pagamento...");
        pixPollDeadline = Date.now() + 5 * 60 * 1000;
        pollComprarStatus(data.purchaseId);
      } catch (err) {
        busy = false;
        msg = "Erro de conexão — tenta de novo.";
        renderDevice();
      }
    }

    function renderPixReceipt(data, statusText) {
      wrap.innerHTML = `
        <div class="pix-receipt">
          <div class="qr-box"><img src="data:image/png;base64,${data.qrCodeBase64}" alt="QR code Pix" /></div>
          <p class="amount-line">${fmtReais(data.amount)} → ${data.coinsAmount.toLocaleString("pt-BR")} DZCoins</p>
          <p class="status" id="pixStatus">${statusText}</p>
          <textarea class="copia-cola" readonly onclick="this.select()">${data.qrCode}</textarea>
          <button class="btn btn-ghost" id="pixCancelar">Cancelar</button>
        </div>
      `;
      const cancelBtn = document.getElementById("pixCancelar");
      if (cancelBtn) cancelBtn.addEventListener("click", () => { clearTimeout(pixPollTimer); goMenu(); });
    }

    function pollComprarStatus(purchaseId) {
      clearTimeout(pixPollTimer);
      if (Date.now() > pixPollDeadline) {
        const statusEl = document.getElementById("pixStatus");
        if (statusEl) statusEl.textContent = "Tempo esgotado — gera um novo Pix se ainda quiser comprar.";
        return;
      }
      pixPollTimer = setTimeout(async () => {
        try {
          const res = await fetch(
            `${FUNCTIONS_URL}/banco-comprar-pix-status?token=${encodeURIComponent(token)}&purchaseId=${purchaseId}`
          );
          const data = await res.json();

          if (data.status === "approved") {
            session.wallet = data.wallet;
            subtitleEl.textContent = `${session.gamertag} · Carteira ${data.wallet} · Banco ${session.bank}`;
            const statusEl = document.getElementById("pixStatus");
            if (statusEl) statusEl.textContent = "✅ Pagamento confirmado! DZCoins creditados.";
            setTimeout(goMenu, 4000);
            return;
          }
          if (data.status === "failed") {
            const statusEl = document.getElementById("pixStatus");
            if (statusEl) statusEl.textContent = "❌ Pagamento não aprovado (recusado/cancelado).";
            return;
          }
        } catch (err) {
          // rede falhou nesse poll especifico — so tenta de novo no proximo,
          // nao desiste do fluxo inteiro por 1 falha isolada.
        }
        pollComprarStatus(purchaseId);
      }, 5000);
    }

    async function loadSession() {
      if (!token) {
        showError("Link inválido — abre o Caixa Eletrônico pelo Discord de novo.");
        return;
      }
      try {
        const res = await fetch(`${FUNCTIONS_URL}/banco-session?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok) {
          showError(data.error || "Link expirado ou inválido.");
          return;
        }
        session.gamertag = data.gamertag;
        session.wallet = data.wallet;
        session.bank = data.bank;
        subtitleEl.textContent = `${data.gamertag} · Carteira ${data.wallet} · Banco ${data.bank}`;
        renderDevice();
      } catch (err) {
        showError("Erro de conexão — tenta de novo em alguns segundos.");
      }
    }

    function showError(errMsg) {
      subtitleEl.textContent = "Sessão indisponível";
      wrap.innerHTML = `<div class="error-screen"><div class="icon">🔒</div><p>${errMsg}</p></div>`;
    }

    loadSession();
  </script>
</body>
</html>
