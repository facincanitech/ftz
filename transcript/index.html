<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transcrição de Ticket — FTZ Bot</title><meta name="description" content="Transcrição completa de um ticket de suporte fechado."><style>:root{--bg:#000;--card:#111110;--border:#222221;--text:#eeeeec;--text-dim:#b5b3ad;--text-faint:#7c7b74;--gold:#fae022}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px}.wrap{max-width:720px;margin:0 auto}.head{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:20px}.head h1{font-size:22px;margin:0 0 8px}.meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--text-faint)}.meta b{color:var(--text-dim)}.msg{display:flex;gap:12px;padding:10px 0}.msg img{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:#222}.msg .body{min-width:0}.msg .row{display:flex;align-items:baseline;gap:8px}.msg .author{font-weight:600;font-size:14px}.msg .time{font-size:11px;color:var(--text-faint)}.msg .content{font-size:14.5px;color:var(--text-dim);white-space:pre-wrap;word-break:break-word}.msg .attach{display:block;margin-top:6px;font-size:12.5px;color:var(--gold);text-decoration:none}.empty{color:var(--text-faint);text-align:center;padding:40px 0}.error{text-align:center;padding:60px 24px;color:var(--text-faint)}</style></head><body><div class="wrap" id="wrap"><div class="error">Carregando...</div></div><script>const FUNCTIONS_URL="https://jefydxrgzyhwlcockbkr.supabase.co/functions/v1",params=new URLSearchParams(window.location.search),id=params.get("id"),wrap=document.getElementById("wrap");function esc(e){const n=document.createElement("div");return n.textContent=e??"",n.innerHTML}function fmt(e){return e?new Date(e).toLocaleString("pt-BR"):"?"}async function load(){if(id)try{const e=await fetch(`${FUNCTIONS_URL}/ticket-transcript?id=${encodeURIComponent(id)}`),n=await e.json();if(!e.ok)throw new Error(n.error||"Falha ao carregar.");document.title=`Transcrição — ticket-${n.ticketNumber}`;const a=Array.isArray(n.messages)?n.messages:[],s=a.length?a.map(e=>{const n=Array.isArray(e.attachments)?e.attachments.map(e=>`<a class="attach" href="${esc(e.url)}" target="_blank" rel="noopener">📎 ${esc(e.name||"anexo")}</a>`).join(""):"";return`<div class="msg">\n                <img src="${esc(e.authorAvatar||"")}" alt="" />\n                <div class="body">\n                  <div class="row"><span class="author">${esc(e.authorUsername)}</span><span class="time">${esc(fmt(e.createdAt))}</span></div>\n                  <div class="content">${esc(e.content)}</div>\n                  ${n}\n                </div>\n              </div>`}).join(""):'<div class="empty">Nenhuma mensagem nesse ticket.</div>';wrap.innerHTML=`\n        <div class="head">\n          <h1>🎫 ticket-${n.ticketNumber}${n.typeLabel?` — ${esc(n.typeLabel)}`:""}</h1>\n          <div class="meta">\n            <span><b>Autor:</b> ${esc(n.openerUsername)}</span>\n            <span><b>Reivindicado por:</b> ${esc(n.claimedByUsername||"Ninguém")}</span>\n            <span><b>Fechado por:</b> ${esc(n.closedByUsername)}</span>\n            ${n.closeReason?`<span><b>Motivo:</b> ${esc(n.closeReason)}</span>`:""}\n            <span><b>Aberto:</b> ${esc(fmt(n.openedAt))}</span>\n            <span><b>Fechado:</b> ${esc(fmt(n.closedAt))}</span>\n          </div>\n        </div>\n        ${s}\n      `}catch(e){wrap.innerHTML=`<div class="error">${esc(e.message)}</div>`}else wrap.innerHTML='<div class="error">Link inválido.</div>'}load()</script></body></html>
