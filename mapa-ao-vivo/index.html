<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mapa ao Vivo — FTZ Bot</title>
<meta name="description" content="Posição dos jogadores online em tempo real." />
<style>
  :root {
    --bg: #0f1115;
    --surface-1: #10131a;
    --surface-2: #171a21;
    --border: #262b36;
    --border-strong: #333a4a;
    --text-primary: #e6e8ec;
    --text-secondary: #b6bcc8;
    --text-muted: #8890a0;
    --accent: #5865f2;
    --success: #2ecc71;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1a1e2a 0%, var(--bg) 55%);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 20px;
  }

  .wrap { max-width: 900px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .meta { font-size: 12px; color: var(--text-muted); }
  header .meta strong { color: var(--success); }

  .panel {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }

  .map-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    overflow: hidden;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-1);
    cursor: zoom-in;
  }
  .map-viewport.zoomed { cursor: grab; }
  .map-viewport.dragging { cursor: grabbing; }
  .map-box {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    transition: transform 0.08s linear;
  }
  .map-box.no-transition { transition: none; }
  .map-box img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
  .zoom-hint {
    position: absolute;
    bottom: 8px;
    right: 10px;
    font-size: 10px;
    color: var(--text-muted);
    background: rgba(6, 9, 15, 0.7);
    padding: 2px 6px;
    border-radius: 4px;
    pointer-events: none;
  }

  .dot {
    position: absolute;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    margin-top: -6px;
    border-radius: 50%;
    background: var(--dot-color, var(--success));
    border: 2px solid #06120a;
    box-shadow: 0 0 0 3px var(--dot-glow, rgba(46, 204, 113, 0.25));
    cursor: default;
    transform: scale(var(--dot-scale, 1));
    transition: left 0.6s ease, top 0.6s ease, transform 0.15s ease;
  }
  .dot::after {
    content: attr(data-label);
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(6, 9, 15, 0.8);
    border: 0.5px solid var(--dot-color, var(--border-strong));
    color: var(--dot-color, var(--text-primary));
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    pointer-events: none;
  }
  .dot:hover::after { z-index: 6; }
  .dot:hover { box-shadow: 0 0 0 5px var(--dot-glow, rgba(46, 204, 113, 0.35)); z-index: 5; }

  .empty, .error {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 40px 12px;
  }
  .error { color: var(--danger); }


  .mode-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .mode-tab {
    flex: 1;
    padding: 8px 10px;
    border-radius: 6px;
    border: 0.5px solid var(--border);
    background: var(--surface-2);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .mode-tab.active { border-color: var(--accent); color: var(--text-primary); background: rgba(88, 101, 242, 0.15); }

  .upload-box {
    display: none;
    margin-bottom: 12px;
    padding: 10px;
    border: 1px dashed var(--border-strong);
    border-radius: 6px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }
  .upload-box.visible { display: block; }
  .upload-box input[type="file"] { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }

  .timeline-box { display: none; margin-top: 12px; }
  .timeline-box.visible { display: flex; align-items: center; gap: 10px; }
  .timeline-box button {
    background: var(--accent);
    border: none;
    color: #fff;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
  }
  .timeline-box button:disabled { opacity: 0.4; cursor: not-allowed; }
  .timeline-box input[type="range"] { flex: 1; }
  .timeline-box .time-label { font-size: 11px; color: var(--text-muted); min-width: 80px; text-align: right; flex-shrink: 0; }

  .window-box { display: none; margin-top: 8px; font-size: 11px; color: var(--text-muted); }
  .window-box.visible { display: flex; flex-direction: column; gap: 4px; }
  .window-row { display: flex; align-items: center; gap: 8px; }
  .window-row label { min-width: 40px; flex-shrink: 0; }
  .window-row input[type="range"] { flex: 1; }
  .window-row span { min-width: 50px; text-align: right; flex-shrink: 0; }

  .pvp-toggle-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--text-secondary); }
  .pvp-toggle-row input { cursor: pointer; }

  .pvp-label {
    position: absolute;
    transform: translate(10px, -6px);
    background: rgba(6, 9, 15, 0.75);
    border: 0.5px solid rgba(255, 107, 107, 0.4);
    color: #ff9b9b;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🗺️ Mapa ao Vivo</h1>
      <div class="meta" id="meta">carregando…</div>
    </header>
    <div class="panel">
      <div class="mode-tabs">
        <button type="button" class="mode-tab active" data-mode="live">🟢 Ao Vivo</button>
        <button type="button" class="mode-tab" data-mode="history">🕒 Últimas 24h</button>
        <button type="button" class="mode-tab" data-mode="upload">📁 Upload de Log</button>
      </div>
      <div class="upload-box" id="uploadBox">
        Escolhe um arquivo <code>.ADM</code> baixado do servidor (dá pra usar qualquer sessão arquivada, sem limite de 24h).
        <br /><input type="file" id="uploadInput" accept=".ADM,.adm,.txt" />
      </div>
      <div id="mapArea">
        <div class="empty">carregando…</div>
      </div>
      <div class="timeline-box" id="timelineBox">
        <button type="button" id="playBtn">▶️</button>
        <input type="range" id="timelineSlider" min="0" max="0" value="0" />
        <span class="time-label" id="timelineLabel">—</span>
      </div>
      <div class="window-box" id="windowBox">
        <div class="window-row">
          <label>Início</label>
          <input type="range" id="windowStartSlider" min="0" max="0" value="0" />
          <span id="windowStartLabel">—</span>
        </div>
        <div class="window-row">
          <label>Fim</label>
          <input type="range" id="windowEndSlider" min="0" max="0" value="0" />
          <span id="windowEndLabel">—</span>
        </div>
        <div class="pvp-toggle-row">
          <input type="checkbox" id="pvpToggle" checked />
          <label for="pvpToggle">🎯 Mostrar PvP (mira + arma + distância)</label>
        </div>
      </div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get("token");
  const FN_URL = "https://xfzfttpnkxqevjfwijpw.supabase.co/functions/v1/live-map-session";
  const REFRESH_MS = 6 * 60 * 1000;

  const mapArea = document.getElementById("mapArea");
  const meta = document.getElementById("meta");

  let currentMapKey = null;
  let zoomLevel = 1;
  // Zoom+pan em espaco de PIXEL, transform-origin fixo em 0 0 —
  // transform: translate(tx,ty) scale(z) mapeia ponto de conteudo (x,y)
  // pra tela em (z*x+tx, z*y+ty). Zoom no cursor: acha o ponto de
  // conteudo sob o mouse ANTES de mudar o zoom, recalcula tx/ty pra
  // aquele mesmo ponto continuar sob o cursor DEPOIS.
  let panX = 0;
  let panY = 0;
  const MIN_ZOOM = 1;
  const MAX_ZOOM = 15;

  function clampPan(rectSize) {
    const minPan = rectSize - rectSize * zoomLevel;
    panX = Math.min(0, Math.max(minPan, panX));
    panY = Math.min(0, Math.max(minPan, panY));
  }

  function applyZoom() {
    const mapBox = document.getElementById("mapBox");
    const viewport = document.getElementById("mapViewport");
    if (!mapBox || !viewport) return;
    mapBox.style.transformOrigin = "0 0";
    mapBox.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
    viewport.classList.toggle("zoomed", zoomLevel > MIN_ZOOM);
    // Bolinha encolhe conforme da zoom, pra nao tampar a area ao redor —
    // nao neutraliza o zoom por completo (1/sqrt em vez de 1/zoom), so
    // reduzido pela metade (pedido do dono, 2026-08-16 — MAX_ZOOM subiu
    // pra 15, bolinha tava grande demais no zoom maximo com a formula
    // antiga).
    const dotScale = 0.5 / Math.sqrt(zoomLevel);
    mapBox.querySelectorAll(".dot").forEach((d) => {
      d.style.setProperty("--dot-scale", dotScale);
    });
  }

  mapArea.addEventListener(
    "wheel",
    (e) => {
      const viewport = e.target.closest(".map-viewport");
      if (!viewport) return;
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const contentX = (mx - panX) / zoomLevel;
      const contentY = (my - panY) / zoomLevel;
      const factor = e.deltaY < 0 ? 1.25 : 0.8;
      const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoomLevel * factor));
      panX = mx - contentX * newZoom;
      panY = my - contentY * newZoom;
      zoomLevel = newZoom;
      if (zoomLevel === MIN_ZOOM) {
        panX = 0;
        panY = 0;
      } else {
        clampPan(rect.width);
      }
      applyZoom();
    },
    { passive: false }
  );

  // Clicar e arrastar pra mover o mapa quando tiver zoom aplicado.
  let dragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let dragPanStartX = 0;
  let dragPanStartY = 0;

  mapArea.addEventListener("mousedown", (e) => {
    const viewport = e.target.closest(".map-viewport");
    if (!viewport || zoomLevel <= MIN_ZOOM) return;
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragPanStartX = panX;
    dragPanStartY = panY;
    const mapBox = document.getElementById("mapBox");
    if (mapBox) mapBox.classList.add("no-transition");
    viewport.classList.add("dragging");
    e.preventDefault();
  });

  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const viewport = document.getElementById("mapViewport");
    if (!viewport) return;
    const rect = viewport.getBoundingClientRect();
    panX = dragPanStartX + (e.clientX - dragStartX);
    panY = dragPanStartY + (e.clientY - dragStartY);
    clampPan(rect.width);
    applyZoom();
  });

  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    const mapBox = document.getElementById("mapBox");
    if (mapBox) mapBox.classList.remove("no-transition");
    const viewport = document.getElementById("mapViewport");
    if (viewport) viewport.classList.remove("dragging");
  });

  // Cor estavel por jogador (hash simples do gamertag -> matiz HSL) —
  // mesma cor sempre pro mesmo jogador entre atualizacoes, sem precisar
  // guardar mapeamento em lugar nenhum.
  function colorForName(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    const hue = hash % 360;
    return `hsl(${hue}, 75%, 55%)`;
  }

  function timeAgo(iso) {
    if (!iso) return "?";
    const secs = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
    if (secs < 60) return `${secs}s atrás`;
    return `${Math.floor(secs / 60)}min atrás`;
  }

  function ensureMapImage(mapInfo) {
    // Troca de modo (Ao Vivo/Histórico/Upload) reescreve mapArea.innerHTML
    // pra mostrar "carregando..." — isso destroi o #mapBox mesmo que o
    // MAPA em si nao tenha mudado, entao o "so reconstroi se a key mudou"
    // sozinho nao basta: precisa checar se o elemento realmente ainda
    // existe no DOM, senao trava mudo (bug real, 2026-08-16).
    if (mapInfo.key !== currentMapKey || !document.getElementById("mapBox")) {
      currentMapKey = mapInfo.key;
      zoomLevel = 1;
      panX = 0;
      panY = 0;
      mapArea.innerHTML =
        '<div class="map-viewport" id="mapViewport"><div class="map-box" id="mapBox">' +
        `<img src="${mapInfo.imageUrl}" alt="${mapInfo.displayName}" />` +
        '</div><div class="zoom-hint">🖱️ scroll pra zoom</div></div>';
    }
    return document.getElementById("mapBox");
  }

  function pctPos(x, y, mapInfo) {
    return { left: (x / mapInfo.worldSize) * 100, top: (1 - y / mapInfo.worldSize) * 100 };
  }

  // Mira semi-transparente (circulo + cruz) na vitima + linha pontilhada
  // ate a posicao aproximada do atacante (quando achamos amostra perto o
  // suficiente dele) + label com arma/distancia. SVG com viewBox 0..100
  // pra usar as MESMAS coordenadas em % que os pontinhos de jogador.
  function renderPvpOverlay(mapBox, mapInfo, pvpEvents) {
    mapBox.querySelectorAll(".pvp-label, #pvpOverlay").forEach((el) => el.remove());
    const pvpToggle = document.getElementById("pvpToggle");
    if (!pvpToggle?.checked || !pvpEvents?.length) return;

    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("id", "pvpOverlay");
    svg.setAttribute("viewBox", "0 0 100 100");
    svg.setAttribute("preserveAspectRatio", "none");
    svg.style.position = "absolute";
    svg.style.inset = "0";
    svg.style.width = "100%";
    svg.style.height = "100%";
    svg.style.pointerEvents = "none";

    for (const ev of pvpEvents) {
      const vp = pctPos(ev.victimPos.x, ev.victimPos.y, mapInfo);

      if (ev.attackerPos) {
        const ap = pctPos(ev.attackerPos.x, ev.attackerPos.y, mapInfo);
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", ap.left);
        line.setAttribute("y1", ap.top);
        line.setAttribute("x2", vp.left);
        line.setAttribute("y2", vp.top);
        line.setAttribute("stroke", "rgba(255,90,90,0.55)");
        line.setAttribute("stroke-width", "0.3");
        line.setAttribute("stroke-dasharray", "1.4,1.2");
        line.setAttribute("vector-effect", "non-scaling-stroke");
        svg.appendChild(line);
      }

      const g = document.createElementNS(svgNS, "g");
      g.setAttribute("transform", `translate(${vp.left}, ${vp.top})`);
      const circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("r", "1.8");
      circle.setAttribute("fill", "rgba(255,90,90,0.12)");
      circle.setAttribute("stroke", "rgba(255,90,90,0.7)");
      circle.setAttribute("stroke-width", "0.25");
      g.appendChild(circle);
      for (const [x1, y1, x2, y2] of [
        [-2.6, 0, -1, 0],
        [1, 0, 2.6, 0],
        [0, -2.6, 0, -1],
        [0, 1, 0, 2.6],
      ]) {
        const l = document.createElementNS(svgNS, "line");
        l.setAttribute("x1", x1);
        l.setAttribute("y1", y1);
        l.setAttribute("x2", x2);
        l.setAttribute("y2", y2);
        l.setAttribute("stroke", "rgba(255,90,90,0.7)");
        l.setAttribute("stroke-width", "0.25");
        g.appendChild(l);
      }
      svg.appendChild(g);
    }
    mapBox.appendChild(svg);

    // Labels em HTML por cima do SVG — mais facil de estilizar texto.
    for (const ev of pvpEvents) {
      const vp = pctPos(ev.victimPos.x, ev.victimPos.y, mapInfo);
      const label = document.createElement("div");
      label.className = "pvp-label";
      label.style.left = `${vp.left}%`;
      label.style.top = `${vp.top}%`;
      const distTxt = ev.distance != null ? ` · ${Math.round(ev.distance)}m` : "";
      label.textContent = `${ev.attacker} → ${ev.victim} · ${ev.weapon ?? "?"}${distTxt}`;
      mapBox.appendChild(label);
    }
  }

  function renderPlayers(mapInfo, players, metaSuffix, pvpEvents) {
    meta.innerHTML = `Mapa: <strong>${mapInfo.displayName}</strong> · ${players.length} jogador(es)${metaSuffix ? " · " + metaSuffix : ""}`;

    const mapBox = ensureMapImage(mapInfo);
    if (!mapBox) return;

    mapBox.querySelectorAll(".dot, .pvp-label, #pvpOverlay").forEach((el) => el.remove());

    if (!players.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.style.position = "absolute";
      empty.style.inset = "0";
      empty.style.display = "flex";
      empty.style.alignItems = "center";
      empty.style.justifyContent = "center";
      empty.textContent = "Ninguém pra mostrar nesse momento.";
      mapBox.appendChild(empty);
      return;
    }

    for (const p of players) {
      const pos = pctPos(p.x, p.y, mapInfo);
      const color = colorForName(p.gamertag);
      const dot = document.createElement("div");
      dot.className = "dot";
      dot.style.left = `${pos.left}%`;
      dot.style.top = `${pos.top}%`;
      dot.style.setProperty("--dot-color", color);
      dot.style.setProperty("--dot-glow", color.replace("55%)", "55%, 0.3)").replace("hsl(", "hsla("));
      dot.dataset.label = p.gamertag;
      mapBox.appendChild(dot);
    }

    if (pvpEvents?.length) renderPvpOverlay(mapBox, mapInfo, pvpEvents);

    applyZoom();
  }

  // ---------- Modo AO VIVO ----------
  let currentMapInfo = null;

  async function loadLive() {
    if (!token) {
      mapArea.innerHTML = '<div class="error">Link inválido — abre pelo botão "Mapa ao Vivo" no Discord.</div>';
      return;
    }
    try {
      const res = await fetch(`${FN_URL}?token=${encodeURIComponent(token)}&mode=live`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Falha ao carregar");
      currentMapInfo = data.map;
      renderPlayers(data.map, data.players, `atualizado ${timeAgo(data.generatedAt)}`);
    } catch (err) {
      mapArea.innerHTML = `<div class="error">${err.message}</div>`;
    }
  }

  let liveInterval = setInterval(() => {
    if (currentModeName === "live") loadLive();
  }, REFRESH_MS);

  // ---------- Frames (usado por "ultimas 24h" e "upload de log") ----------
  // Agrupa pontos soltos {gamertag,x,y,t} em "frames" — cada frame e um
  // instante de tempo (arredondado pro bucket de 5min mais proximo, MESMA
  // cadencia que o .ADM ja registra posicao) com a posicao mais recente
  // conhecida de CADA jogador ate aquele momento (arrasta pra frente quem
  // nao teve amostra nova nesse bucket especifico). STALE_MS: se a ultima
  // amostra de alguem ja passou desse tanto de tempo (desconectou e nunca
  // mais apareceu), some da lista em vez de ficar preso pra sempre —
  // mesma janela de "fantasma" que o Mapa ao Vivo ja usa (15min), um
  // pouco mais folgado aqui (20min) pra tolerar 1 amostra perdida sem
  // sumir a toa.
  const BUCKET_MS = 5 * 60 * 1000;
  const STALE_MS = 20 * 60 * 1000;

  function bucketKey(msEpoch) {
    return Math.round(msEpoch / BUCKET_MS) * BUCKET_MS;
  }

  function buildFrames(points, pvpEvents = []) {
    const buckets = new Map(); // bucketMs -> Map(gamertag -> {x,y})
    for (const p of points) {
      const key = bucketKey(p.msEpoch);
      if (!buckets.has(key)) buckets.set(key, new Map());
      buckets.get(key).set(p.gamertag, { x: p.x, y: p.y });
    }
    const pvpByBucket = new Map();
    for (const ev of pvpEvents) {
      const key = bucketKey(ev.msEpoch);
      if (!pvpByBucket.has(key)) pvpByBucket.set(key, []);
      pvpByBucket.get(key).push(ev);
    }
    const allKeys = new Set([...buckets.keys(), ...pvpByBucket.keys()]);
    const sortedKeys = [...allKeys].sort((a, b) => a - b);
    const state = new Map(); // gamertag -> {x,y,lastKey}
    const frames = [];
    for (const key of sortedKeys) {
      const bucket = buckets.get(key);
      if (bucket) for (const [name, pos] of bucket) state.set(name, { ...pos, lastKey: key });
      const players = [...state.entries()]
        .filter(([, v]) => key - v.lastKey <= STALE_MS)
        .map(([gamertag, v]) => ({ gamertag, x: v.x, y: v.y }));
      frames.push({ msEpoch: key, players, pvp: pvpByBucket.get(key) ?? [] });
    }
    return frames;
  }

  // ---------- Timeline (play/pause/slider + janela inicio/fim) ----------
  const timelineBox = document.getElementById("timelineBox");
  const timelineSlider = document.getElementById("timelineSlider");
  const timelineLabel = document.getElementById("timelineLabel");
  const playBtn = document.getElementById("playBtn");
  const windowBox = document.getElementById("windowBox");
  const windowStartSlider = document.getElementById("windowStartSlider");
  const windowEndSlider = document.getElementById("windowEndSlider");
  const windowStartLabel = document.getElementById("windowStartLabel");
  const windowEndLabel = document.getElementById("windowEndLabel");
  const pvpToggle = document.getElementById("pvpToggle");

  let currentFrames = [];
  let playTimer = null;
  // Janela (2 pontos escolhidos na barra, tipo o iZurvive antigo) — play
  // e o slider principal ficam PRESOS a esse intervalo em vez de sempre
  // pegar o log inteiro desde o comeco.
  let windowStart = 0;
  let windowEnd = 0;

  function formatTimeShort(msEpoch) {
    const d = new Date(msEpoch);
    const hh = String(d.getUTCHours()).padStart(2, "0");
    const mm = String(d.getUTCMinutes()).padStart(2, "0");
    return `${hh}:${mm}`;
  }

  function formatFrameLabel(msEpoch, index, total) {
    return `${formatTimeShort(msEpoch)} (${index + 1}/${total})`;
  }

  function showFrame(index) {
    if (!currentFrames.length) return;
    const clamped = Math.max(windowStart, Math.min(windowEnd, index));
    timelineSlider.value = String(clamped);
    const frame = currentFrames[clamped];
    timelineLabel.textContent = formatFrameLabel(frame.msEpoch, clamped, currentFrames.length);
    // Nunca falha em silencio — se currentMapInfo nao carregou por algum
    // motivo, mostra erro em vez de deixar a tela travada sem explicacao
    // nenhuma (mesma licao do bug do ensureMapImage acima).
    if (currentMapInfo) renderPlayers(currentMapInfo, frame.players, "modo replay", frame.pvp);
    else mapArea.innerHTML = '<div class="error">Não consegui carregar a info do mapa — tenta recarregar a página.</div>';
  }

  function setFrames(frames) {
    currentFrames = frames;
    pausePlayback();
    timelineBox.classList.toggle("visible", frames.length > 0);
    windowBox.classList.toggle("visible", frames.length > 0);
    const maxIdx = Math.max(0, frames.length - 1);
    timelineSlider.max = String(maxIdx);
    windowStartSlider.max = String(maxIdx);
    windowEndSlider.max = String(maxIdx);
    windowStart = 0;
    windowEnd = maxIdx;
    windowStartSlider.value = "0";
    windowEndSlider.value = String(maxIdx);
    if (!frames.length) {
      mapArea.innerHTML = '<div class="error">Nenhuma posição encontrada nessa janela — tenta outro período ou arquivo.</div>';
      return;
    }
    updateWindowLabels();
    showFrame(maxIdx); // comeca no frame mais recente
  }

  function updateWindowLabels() {
    if (!currentFrames.length) return;
    windowStartLabel.textContent = formatTimeShort(currentFrames[windowStart].msEpoch);
    windowEndLabel.textContent = formatTimeShort(currentFrames[windowEnd].msEpoch);
  }

  windowStartSlider.addEventListener("input", () => {
    let v = Number(windowStartSlider.value);
    if (v > windowEnd) v = windowEnd;
    windowStart = v;
    windowStartSlider.value = String(v);
    updateWindowLabels();
    pausePlayback();
    showFrame(windowStart);
  });
  windowEndSlider.addEventListener("input", () => {
    let v = Number(windowEndSlider.value);
    if (v < windowStart) v = windowStart;
    windowEnd = v;
    windowEndSlider.value = String(v);
    updateWindowLabels();
    pausePlayback();
    showFrame(windowEnd);
  });
  pvpToggle.addEventListener("change", () => showFrame(Number(timelineSlider.value)));

  function pausePlayback() {
    if (playTimer) clearInterval(playTimer);
    playTimer = null;
    playBtn.textContent = "▶️";
  }

  playBtn.addEventListener("click", () => {
    if (playTimer) {
      pausePlayback();
      return;
    }
    playBtn.textContent = "⏸️";
    // Se ja estiver no fim da janela, reinicia do inicio dela.
    if (Number(timelineSlider.value) >= windowEnd) showFrame(windowStart);
    playTimer = setInterval(() => {
      const next = Number(timelineSlider.value) + 1;
      if (next > windowEnd) {
        pausePlayback();
        return;
      }
      showFrame(next);
    }, 700);
  });

  timelineSlider.addEventListener("input", () => {
    pausePlayback();
    showFrame(Number(timelineSlider.value));
  });

  // ---------- Modo ULTIMAS 24H ----------
  async function loadHistory() {
    mapArea.innerHTML = '<div class="empty">carregando histórico…</div>';
    try {
      const res = await fetch(`${FN_URL}?token=${encodeURIComponent(token)}&mode=history&hours=24`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Falha ao carregar histórico");
      currentMapInfo = data.map;
      const points = data.points.map((p) => ({ gamertag: p.gamertag, x: p.x, y: p.y, msEpoch: new Date(p.t).getTime() }));
      const pvpEvents = (data.pvp ?? [])
        .filter((ev) => ev.victimPos)
        .map((ev) => ({ ...ev, msEpoch: new Date(ev.t).getTime() }));
      setFrames(buildFrames(points, pvpEvents));
    } catch (err) {
      mapArea.innerHTML = `<div class="error">${err.message}</div>`;
    }
  }

  // ---------- Modo UPLOAD DE LOG ----------
  // Mesmo padrao de linha que o parser do bot ja reconhece (src/parser/admLogParser.js)
  // — so a posicao periodica, com ou sem sufixo de evento depois do pos=<...>.
  const ADM_LINE_RE = /^(\d{2}):(\d{2}):(\d{2}) \| Player "([^"]+)" \(id=[0-9A-Fa-f]+ pos=<([-\d.]+), ([-\d.]+), ([-\d.]+)>\)/;

  // Kill PvP FATAL, com posicao dos 2 (vitima E atacante) na MESMA linha
  // — diferente do historico (banco so tem posicao da vitima, atacante e
  // aproximado), aqui e exato, os 2 vem juntos no arquivo. Weapon+distancia
  // opcional (melee corpo-a-corpo nao tem "from X meters", mesmo caso ja
  // documentado no parser do bot — ver WEAPON_DISTANCE_RE/MELEE_WEAPON_RE
  // em src/parser/admLogParser.js).
  const KILL_LINE_RE =
    /^(\d{2}):(\d{2}):(\d{2}) \| Player "([^"]+)" \(id=[\w-]+ pos=<([-\d.]+), ([-\d.]+), [-\d.]+>\) killed by Player "([^"]+)" \(id=[\w-]+ pos=<([-\d.]+), ([-\d.]+), [-\d.]+>\)(?: with ([^"]+?) from ([\d.]+) meters| with ([^"]+))?/;

  function secondsOfLine(hh, mm, ss, state) {
    let seconds = Number(hh) * 3600 + Number(mm) * 60 + Number(ss);
    if (state.lastSeconds !== -1 && seconds < state.lastSeconds - 60) state.dayOffset += 86400;
    state.lastSeconds = seconds;
    return seconds + state.dayOffset;
  }

  function parseAdmFile(text) {
    const points = [];
    const pvpEvents = [];
    const posState = { dayOffset: 0, lastSeconds: -1 };
    const killState = { dayOffset: 0, lastSeconds: -1 };
    for (const line of text.split("\n")) {
      const posMatch = ADM_LINE_RE.exec(line);
      if (posMatch) {
        const [, hh, mm, ss, gamertag, x, y] = posMatch;
        const totalSeconds = secondsOfLine(hh, mm, ss, posState);
        points.push({ gamertag, x: Number(x), y: Number(y), msEpoch: totalSeconds * 1000 });
        continue;
      }
      const killMatch = KILL_LINE_RE.exec(line);
      if (killMatch) {
        const [, hh, mm, ss, victim, vx, vy, attacker, ax, ay, weaponDist, distance, weaponMelee] = killMatch;
        const totalSeconds = secondsOfLine(hh, mm, ss, killState);
        pvpEvents.push({
          victim,
          attacker,
          weapon: weaponDist ?? weaponMelee ?? null,
          distance: distance != null ? Number(distance) : null,
          victimPos: { x: Number(vx), y: Number(vy) },
          attackerPos: { x: Number(ax), y: Number(ay) },
          msEpoch: totalSeconds * 1000,
        });
      }
    }
    return { points, pvpEvents };
  }

  document.getElementById("uploadInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    mapArea.innerHTML = '<div class="empty">lendo arquivo…</div>';
    try {
      const text = await file.text();
      const { points, pvpEvents } = parseAdmFile(text);
      if (!currentMapInfo) {
        // upload pode acontecer antes de qualquer fetch — pega o mapa
        // atual do servidor mesmo assim (so a info do mapa, sem posicao).
        const res = await fetch(`${FN_URL}?token=${encodeURIComponent(token)}&mode=live`);
        const data = await res.json();
        if (res.ok) currentMapInfo = data.map;
      }
      setFrames(buildFrames(points, pvpEvents));
    } catch (err) {
      mapArea.innerHTML = `<div class="error">Falha ao ler o arquivo: ${err.message}</div>`;
    }
  });

  // ---------- Troca de modo ----------
  let currentModeName = "live";
  const uploadBox = document.getElementById("uploadBox");

  document.querySelectorAll(".mode-tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".mode-tab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      currentModeName = tab.dataset.mode;
      pausePlayback();
      uploadBox.classList.toggle("visible", currentModeName === "upload");
      timelineBox.classList.toggle("visible", currentModeName !== "live" && currentFrames.length > 0);
      windowBox.classList.toggle("visible", currentModeName !== "live" && currentFrames.length > 0);

      if (currentModeName === "live") {
        currentFrames = [];
        loadLive();
      } else if (currentModeName === "history") {
        loadHistory();
      } else {
        mapArea.innerHTML = '<div class="empty">Escolhe um arquivo .ADM acima pra começar.</div>';
        currentFrames = [];
        timelineBox.classList.remove("visible");
        windowBox.classList.remove("visible");
      }
    });
  });

  loadLive();
</script>
</body>
</html>
