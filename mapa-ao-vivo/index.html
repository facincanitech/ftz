<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa ao Vivo — FTZ Bot</title><meta name="description" content="Posição dos jogadores online em tempo real."><style>:root{--bg:#0f1115;--surface-1:#10131a;--surface-2:#171a21;--border:#262b36;--border-strong:#333a4a;--text-primary:#e6e8ec;--text-secondary:#b6bcc8;--text-muted:#8890a0;--accent:#5865f2;--success:#2ecc71;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#1a1e2a 0,var(--bg) 55%);color:var(--text-primary);min-height:100vh;padding:20px}.wrap{max-width:900px;margin:0 auto}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}header h1{font-size:17px;margin:0;font-weight:600}header .meta{font-size:12px;color:var(--text-muted)}header .meta strong{color:var(--success)}.panel{background:var(--surface-2);border:.5px solid var(--border);border-radius:8px;padding:12px}.map-box{position:relative;width:100%;aspect-ratio:1/1;border-radius:6px;overflow:hidden;border:.5px solid var(--border-strong);background:var(--surface-1)}.map-box img{width:100%;height:100%;display:block;object-fit:cover}.dot{position:absolute;width:12px;height:12px;margin-left:-6px;margin-top:-6px;border-radius:50%;background:var(--success);border:2px solid #06120a;box-shadow:0 0 0 3px rgba(46,204,113,.25);cursor:default;transition:left .6s ease,top .6s ease}.dot::after{content:attr(data-label);position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#06090f;border:.5px solid var(--border-strong);color:var(--text-primary);padding:3px 7px;border-radius:4px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}.dot:hover::after{opacity:1}.dot:hover{background:#58f29a;z-index:5}.empty,.error{text-align:center;color:var(--text-muted);font-size:13px;padding:40px 12px}.error{color:var(--danger)}.players-list{margin-top:12px;font-size:12px;color:var(--text-secondary);display:flex;flex-wrap:wrap;gap:6px}.players-list span{background:var(--surface-1);border:.5px solid var(--border);border-radius:4px;padding:3px 8px}</style></head><body><div class="wrap"><header><h1>🗺️ Mapa ao Vivo</h1><div class="meta" id="meta">carregando…</div></header><div class="panel"><div id="mapArea"><div class="empty">carregando…</div></div><div class="players-list" id="playersList"></div></div></div><script>const params=new URLSearchParams(location.search),token=params.get("token"),FN_URL="https://xfzfttpnkxqevjfwijpw.supabase.co/functions/v1/live-map-session",REFRESH_MS=6e4,mapArea=document.getElementById("mapArea"),meta=document.getElementById("meta"),playersList=document.getElementById("playersList");let currentMapKey=null;function timeAgo(e){if(!e)return"?";const t=Math.max(0,Math.floor((Date.now()-new Date(e).getTime())/1e3));return t<60?`${t}s atrás`:`${Math.floor(t/60)}min atrás`}function render(e){meta.innerHTML=`Mapa: <strong>${e.map.displayName}</strong> · ${e.players.length} online · atualizado ${timeAgo(e.generatedAt)}`,e.map.key!==currentMapKey&&(currentMapKey=e.map.key,mapArea.innerHTML=`<div class="map-box" id="mapBox"><img src="${e.map.imageUrl}" alt="${e.map.displayName}" /></div>`);const t=document.getElementById("mapBox");if(t){if(t.querySelectorAll(".dot").forEach(e=>e.remove()),playersList.innerHTML="",!e.players.length){const e=document.createElement("div");return e.className="empty",e.style.position="absolute",e.style.inset="0",e.style.display="flex",e.style.alignItems="center",e.style.justifyContent="center",e.textContent="Ninguém online no momento.",void t.appendChild(e)}for(const a of e.players){const n=a.x/e.map.worldSize*100,o=100*(1-a.y/e.map.worldSize),r=document.createElement("div");r.className="dot",r.style.left=`${n}%`,r.style.top=`${o}%`,r.dataset.label=`${a.gamertag}${null!=a.xp?` · ${a.xp} XP`:""}`,t.appendChild(r);const s=document.createElement("span");s.textContent=`🟢 ${a.gamertag}`,playersList.appendChild(s)}}}async function load(){if(token)try{const e=await fetch(`${FN_URL}?token=${encodeURIComponent(token)}`),t=await e.json();if(!e.ok)throw new Error(t.error||"Falha ao carregar");render(t)}catch(e){mapArea.innerHTML=`<div class="error">${e.message}</div>`}else mapArea.innerHTML='<div class="error">Link inválido — abre pelo botão "Mapa ao Vivo" no Discord.</div>'}load(),setInterval(load,6e4)</script></body></html>
